name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - ".editorconfig"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deployment input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.0"

      - name: Set up Node.js for validators
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.6 --check "site/**/*.{html,css}"
          npx --yes html-validate@11.9.0 "site/*.html"
          npx --yes stylelint@17.14.1 --config .stylelintrc.json "site/**/*.css"
          python scripts/validate-site.py

      - name: Smoke test local HTTP response
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --directory site >/tmp/fukamu-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/tmp/fukamu-index.html; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "::error::Local site did not become ready"
              exit 1
            fi
            sleep 1
          done
          grep --fixed-strings --quiet "FUKAMU" /tmp/fukamu-index.html

  deploy:
    name: Direct Upload to Cloudflare Pages
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-site
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deployment configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          set -euo pipefail
          for required_name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME CLOUDFLARE_PAGES_API_TOKEN; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "::error::${required_name} is required for production deployment"
              exit 1
            fi
          done
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character lowercase hexadecimal ID"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_PAGES_PROJECT_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT_NAME has an invalid format"
            exit 1
          fi

      - name: Deploy site directory
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.125.0"
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
