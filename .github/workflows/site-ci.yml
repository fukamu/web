name: Site CI

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/**"
      - ".editorconfig"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - ".github/workflows/site-ci.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - ".editorconfig"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - ".github/workflows/site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.0"

      - name: Set up Node.js for validators
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Check HTML and CSS formatting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.6 --check "site/**/*.{html,css}"

      - name: Validate HTML and accessibility basics
        shell: bash
        run: |
          set -euo pipefail
          npx --yes html-validate@11.9.0 "site/*.html"

      - name: Validate CSS
        shell: bash
        run: |
          set -euo pipefail
          npx --yes stylelint@17.14.1 --config .stylelintrc.json "site/**/*.css"

      - name: Run repository validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-site.py

      - name: Smoke test local HTTP response
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --directory site >/tmp/fukamu-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/tmp/fukamu-index.html; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "::error::Local site did not become ready"
              exit 1
            fi
            sleep 1
          done
          grep --fixed-strings --quiet "FUKAMU" /tmp/fukamu-index.html
